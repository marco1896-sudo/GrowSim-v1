<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grow Simulator</title>
    <!-- Haupt‑Stylesheet für Dark‑HUD‑Look und Komponenten -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Statusleiste oben -->
      <header class="topbar">
        <div class="topbar-left">
          <span id="dayDisplay">Tag 1</span>
        </div>
        <div class="topbar-center">
          <span id="timeDisplay">08:00</span>
        </div>
        <div class="topbar-right">
          <span>Ads verblieben:&nbsp;<span id="adsLeft">6</span></span>
        </div>
      </header>

      <!-- Hauptkarte mit Pflanze und Statistiken -->
      <main class="main-content">
        <section class="plant-card card">
          <h2>Pflanze</h2>
          <div class="gauges">
            <div id="healthGauge" class="gauge health" style="--gauge-value:1">
              <div class="gauge-inner">
                <span class="gauge-label">Gesundheit</span>
                <span class="gauge-value">100%</span>
              </div>
            </div>
            <div id="growthGauge" class="gauge growth" style="--gauge-value:0">
              <div class="gauge-inner">
                <span class="gauge-label">Wachstum</span>
                <span class="gauge-value">0%</span>
              </div>
            </div>
          </div>
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Wasser</span>
              <div class="stat-bar">
                <div id="waterBar" class="stat-fill" style="width:100%"></div>
              </div>
            </div>
            <div class="stat">
              <span class="stat-label">Nährstoffe</span>
              <div class="stat-bar">
                <div id="nutrientBar" class="stat-fill" style="width:100%"></div>
              </div>
            </div>
            <div class="stat">
              <span class="stat-label">Stadium</span>
              <div class="stat-bar" style="background:transparent">
                <span id="stageDisplay" class="stage-text">Keimling</span>
              </div>
            </div>
          </div>
        </section>

        <!-- Aktionsbereich mit Werbe‑Buttons -->
        <section class="actions card">
          <button id="adSkipButton" class="btn primary">Ad: +30 Min</button>
          <button id="adRescueButton" class="btn danger">Ad: Rettung</button>
          <button id="adAnalysisButton" class="btn info">Ad: Analyse</button>
        </section>
      </main>

      <!-- Event‑Modal -->
      <div id="eventModal" class="modal hidden">
        <div class="modal-content card">
          <h3 id="eventTitle">Event</h3>
          <p id="eventDescription">Beschreibung</p>
          <div id="eventActions" class="event-actions"></div>
        </div>
      </div>

      <!-- Analyse‑Modal -->
      <div id="analysisModal" class="modal hidden">
        <div class="modal-content card analysis-content">
          <button id="analysisClose" class="modal-close">×</button>
          <div id="analysisContent"></div>
        </div>
      </div>
    </div>

    <!-- Haupt‑Script -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
